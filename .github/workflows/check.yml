name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    # sandbox-exec confinement, the macOS gzip
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          CORTEX_EXPECT_SANDBOX: "1"

  linux-bubblewrap:
    # bubblewrap confinement. Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - run: npm test
        env:
          CORTEX_EXPECT_SANDBOX: "1"
